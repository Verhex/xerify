name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - id: release
        run: node scripts/verify-release-tag.mjs >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm run smoke:install
      - run: npm run release:audit
      - run: npm pack --pack-destination artifacts --ignore-scripts
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.release.outputs.tarball }}
          sbom-path: artifacts/xerify.spdx.json
      - name: Check whether the exact npm version already exists
        id: registry
        shell: bash
        run: |
          if npm view "${{ steps.release.outputs.package }}@${{ steps.release.outputs.version }}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # `0.1.0` reached the registry outside this workflow, so its publish step was skipped by the
      # guard below and npm recorded no provenance attestation for it. Provenance is generated when
      # the publish itself runs here, because this job holds `id-token: write` and the manifest sets
      # `publishConfig.provenance`. `--provenance` is passed explicitly so the intent survives a
      # manifest edit, and the run fails rather than publishing silently without it.
      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.release.outputs.tarball }}" --access public --provenance
      - name: Verify published tarball and provenance
        env:
          RELEASE_TARBALL: ${{ steps.release.outputs.tarball }}
        run: node scripts/verify-npm-publication.mjs
      - name: Point the previous package to xerify-cli
        if: steps.release.outputs.package == 'xerify-cli' && steps.release.outputs.version == '0.3.1'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm deprecate 'xverify-cli@*' 'Renamed to xerify-cli. Install xerify-cli instead; the command remains xerify. Migration instructions https://github.com/Verhex/xerify/blob/main/docs/installation.md'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.release.outputs.tarball }}"
          artifacts/xerify.spdx.json
          artifacts/production-licenses.json
          artifacts/npm-pack-audit.json
          --verify-tag
          --generate-notes
